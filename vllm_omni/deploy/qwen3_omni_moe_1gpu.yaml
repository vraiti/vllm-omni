# Qwen3-Omni-MoE single-GPU deployment profile.
#
# All pipeline stages share GPU 0. This profile is intended for single-GPU
# environments; the production profile keeps the thinker on GPU 0 and the
# talker/code2wav stages on GPU 1.
base_config: qwen3_omni_moe.yaml

stages:
  - stage_id: 0
    devices: "0"
  - stage_id: 1
    devices: "0"
  - stage_id: 2
    devices: "0"
